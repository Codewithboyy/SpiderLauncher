name: Version Bump & Release Tag

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

jobs:
  bump-version:
    name: Bump Version & Create Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | grep -oP '"\K[^"]+')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Compute new version
        id: newver
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.VERSION }}"
          case "${{ github.event.inputs.bump_type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "NEW_VERSION=$NEW" >> $GITHUB_OUTPUT
          echo "New version: $NEW"

      - name: Update version in build.gradle
        run: |
          NEW="${{ steps.newver.outputs.NEW_VERSION }}"
          sed -i "s/versionName \".*\"/versionName \"${NEW}\"/" android/app/build.gradle
          # Increment versionCode
          OLD_CODE=$(grep 'versionCode' android/app/build.gradle | grep -oP '\d+')
          NEW_CODE=$((OLD_CODE+1))
          sed -i "s/versionCode ${OLD_CODE}/versionCode ${NEW_CODE}/" android/app/build.gradle
          echo "Updated versionName to $NEW, versionCode to $NEW_CODE"

      - name: Commit and tag
        run: |
          NEW="v${{ steps.newver.outputs.NEW_VERSION }}"
          git add android/app/build.gradle
          git commit -m "chore: bump version to $NEW"
          git tag -a "$NEW" -m "Release $NEW${{ github.event.inputs.release_notes && format(': {0}', github.event.inputs.release_notes) || '' }}"
          git push origin HEAD
          git push origin "$NEW"
          echo "Tagged and pushed $NEW"
